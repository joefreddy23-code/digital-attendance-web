<div class="sidebar__brand">
  @if (layout.sidebarExpanded()) {
    <div class="sidebar__brand-expanded">
      <img
        class="sidebar__logo sidebar__logo--full"
        src="trio_logo_horizontal@3x.png"
        alt="TRIGENT"
      />
      <p class="sidebar__brand-tag">Attendance &amp; Compliance</p>
    </div>
  } @else {
    <img
      class="sidebar__logo sidebar__logo--half"
      src="trio_logo_stacked.png"
      alt="TRIGENT"
    />
  }
</div>

<nav class="sidebar__nav" aria-label="Main">
  @for (item of visibleNavItems; track item.path) {
    <a
      class="sidebar__link"
      [routerLink]="item.path"
      routerLinkActive="sidebar__link--active"
      [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
    >
      <i class="fa-solid {{ item.icon }} sidebar__icon" aria-hidden="true"></i>
      @if (layout.sidebarExpanded()) {
        <span class="sidebar__label">{{ item.label }}</span>
      }
    </a>
  }
</nav>

<a
  class="sidebar__profile"
  routerLink="/profile"
  routerLinkActive="sidebar__profile--active"
  aria-label="View profile"
>
  <div class="sidebar__avatar" aria-hidden="true">{{ initials }}</div>
  @if (layout.sidebarExpanded()) {
    <div class="sidebar__profile-text">
      <div class="sidebar__profile-name">{{ displayName }}</div>
      <div class="sidebar__profile-role">{{ displayRole }}</div>
    </div>
  }
</a>
